services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./design:/usr/share/nginx/html/design:ro
      - ./content:/usr/share/nginx/html/content:ro
    networks:
      - proxy
networks:
  proxy:
    external: true
    name: proxy
