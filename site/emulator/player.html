<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>شبیه‌ساز | سوپر شانزده بیت</title>
<link rel="stylesheet" href="../../design/tokens.css">
<link rel="stylesheet" href="../../design/components.css">
<style>
body { background: radial-gradient(circle at 50% 0%, #1B2450 0%, #0B1026 60%); color: #F4F1DE; font-family: "Vazirmatn", system-ui, sans-serif; margin: 0; padding: 1.5rem 1rem 3rem; }
.wrap { max-width: 960px; margin-inline: auto; display: grid; gap: 1rem; }
a { color: #F5B301; text-decoration: none; }
#game { width: 100%; aspect-ratio: 4/3; background: #000; position: relative; z-index: 1; }
.hint { color: var(--muted); line-height: 2; font-size: 0.9rem; }
.load-error { background: #2A1530; border: 2px dashed var(--danger); border-radius: 12px; padding: 1.5rem; line-height: 2; }
</style>
</head>
<body>
<div class="wrap">
<div class="console-shell">
<div class="console-shell__brand">
<span class="power-led" aria-hidden="true"></span>
<div class="console-shell__title">
سوپر شانزده بیت
<small>در حال اجرای کارتریج</small>
</div>
</div>
<div class="console-shell__actions">
<a href="../index.html">خانه</a>
<strong id="game-title">بازی</strong>
</div>
</div>
<div class="purple-stripe" aria-hidden="true"></div>

<section class="crt" aria-label="تلویزیون">
<div class="crt__screen">
<div id="game"><p style="color:#9AA3C7;">در حال بارگذاری شبیه‌ساز…</p></div>
<div class="crt__glare"></div>
</div>
<div class="crt__bar">
<span class="channel-badge" dir="ltr">CH-16</span>
<span class="press-start" id="emu-status">در حال بارگذاری</span>
<span id="game-meta"></span>
</div>
</section>

<div id="load-error" class="load-error" hidden></div>

<p class="hint">کنترل با صفحه‌کلید انجام می‌شود. اگر بازی شروع نشد، اتصال اینترنت را برای بارگذاری هسته شبیه‌ساز بررسی کن. فایل بازی به صورت محلی خوانده می‌شود.</p>
</div>
<script>
(function(){
var params = new URLSearchParams(location.search);
var slug = params.get("slug") || "";
function fail(msg) {
  var box = document.getElementById("load-error");
  box.hidden = false;
  box.textContent = msg;
  document.getElementById("emu-status").textContent = "خطا";
  document.getElementById("game").innerHTML = "";
}
fetch("../../content/games.json").then(function(r){
  if (!r.ok) throw new Error("games.json");
  return r.json();
}).then(function(games){
  var g = null;
  games.forEach(function(x){ if (x.slug === slug) g = x; });
  if (!g) { fail("بازی پیدا نشد."); return; }
  if (!g.rom_path) { fail("فایل این بازی هنوز به آرشیو اضافه نشده است."); return; }
  document.getElementById("game-title").textContent = g.title;
  document.title = g.title + " | سوپر شانزده بیت";
  var meta = document.getElementById("game-meta");
  if (meta) meta.textContent = g.console || "";
  var romUrl = "../../" + g.rom_path.replace(/^\.\.\//, "");
  var core = g.emu_core || (g.rom_path.slice(-4).toLowerCase() === ".gbc" ? "gbc" : "gb");
  // EmulatorJS reads these from the global scope, so they must live on window.
  window.EJS_player = "#game";
  window.EJS_core = core;
  window.EJS_gameName = g.title;
  window.EJS_gameUrl = romUrl;
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_disableDatabases = true;
  var script = document.createElement("script");
  script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
  script.onerror = function(){ fail("بارگذاری شبیه‌ساز از اینترنت ناموفق بود. اتصال را بررسی کن."); };
  document.body.appendChild(script);
}).catch(function(){ fail("خواندن فهرست بازی‌ها ناموفق بود."); });
})();
</script>
</body>
</html>
