<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>شبیه‌ساز</title>
<link rel="stylesheet" href="../../design/tokens.css">
<style>
body { background: #0B1026; color: #F4F1DE; font-family: "Vazirmatn", system-ui, sans-serif; margin: 0; padding: 1rem; }
.wrap { max-width: 960px; margin-inline: auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
a { color: #F5B301; text-decoration: none; }
#game { width: 100%; aspect-ratio: 4/3; background: #000; border: 4px solid #2A3563; border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
<header>
<a href="../index.html">خانه</a>
<strong id="game-title">بازی</strong>
</header>
<div id="game"></div>
</div>
<script>
var params = new URLSearchParams(location.search);
var slug = params.get("slug") || "";
fetch("../../content/games.json").then(function(r){return r.json();}).then(function(games){
var g = null;
games.forEach(function(x){ if (x.slug === slug) g = x; });
if (!g) { document.getElementById("game-title").textContent = "بازی پیدا نشد"; return; }
document.getElementById("game-title").textContent = g.title;
var EJS_player = "#game";
var EJS_core = g.emu_core || "auto";
var EJS_gameUrl = g.rom_path ? "../../" + g.rom_path.replace(/^\.\.\//, "") : "";
var EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
var EJS_language = "fa";
var EJS_startOnLoaded = true;
var EJS_disableDatabases = true;
var script = document.createElement("script");
script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
document.body.appendChild(script);
});
</script>
</body>
</html>
