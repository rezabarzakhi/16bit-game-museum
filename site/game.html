<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>game page</title>
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../design/components.css">
<style>
body { background: var(--bg); color: var(--text); font-family: var(--font-fa); margin: 0; padding: 2rem; }
.wrap { max-width: 960px; margin-inline: auto; display: grid; gap: 1.5rem; }
.meta { color: var(--muted); font-size: 0.85rem; }
a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
<a href="./index.html">back</a>
<div id="empty" class="empty-state" hidden>nothing found sample</div>
<article id="game" hidden>
<h1 id="title"></h1>
<p id="summary"></p>
<p class="mobile-warning">better with desktop warning sample</p>
<div class="game-frame" id="frame"><button class="game-frame__start" id="start" type="button">start</button></div>
<h2>controls</h2>
<div class="control-guide" id="controls"></div>
<h2>article</h2>
<div class="article-body" id="article"><p>article placeholder for local skeleton</p></div>
<p class="meta" id="meta"></p>
<div id="tags"></div>
<br>
<button class="report-button" type="button">report</button>
</article>
</div>
<script src="./game.js"></script>
</body>
</html>
