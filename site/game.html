<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>صفحه بازی</title>
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../design/components.css">
<style>
body { background: var(--bg); color: var(--text); font-family: var(--font-fa); margin: 0; padding: 2rem; }
.wrap { max-width: 960px; margin-inline: auto; display: grid; gap: 1.5rem; }
.meta { color: var(--muted); font-size: 0.85rem; }
a { color: var(--accent); }
.console-badge { display: inline-block; background: var(--info); color: #fff; border-radius: 6px; padding: 0.2rem 0.6rem; font-size: 0.75rem; font-weight: 700; }
#cover { max-height: 220px; overflow: hidden; border-radius: var(--radius-md); border: 2px solid var(--border); }
#cover img { width: 100%; height: 220px; object-fit: cover; image-rendering: pixelated; display: block; }
.emu-container { width: 100%; aspect-ratio: 4 / 3; background: #000; border: 4px solid var(--border); border-radius: var(--radius-md); display: grid; place-items: center; }
.emu-container iframe { width: 100%; height: 100%; border: 0; }
.license-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; font-size: 0.85rem; color: var(--muted); }
.license-box strong { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
<a href="./index.html">بازگشت</a>
<div id="empty" class="empty-state" hidden>چیزی پیدا نشد</div>
<article id="game" hidden>
<div id="cover"></div>
<div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
<h1 id="title" style="margin:0;"></h1>
<span class="console-badge" id="console"></span>
</div>
<p id="summary"></p>
<p class="mobile-warning">تجربه بهتر با رایانه</p>
<div class="emu-container" id="frame"><button class="game-frame__start" id="start" type="button">شروع</button></div>
<h2>راهنمای کنترل</h2>
<div class="control-guide" id="controls"></div>
<h2>مقاله</h2>
<div class="article-body" id="article"><p>در حال بارگذاری مقاله</p></div>
<div class="license-box" id="license"></div>
<p class="meta" id="meta"></p>
<div id="tags" style="display:flex;gap:0.5rem;flex-wrap:wrap;"></div>
<br>
<button class="report-button" id="report" type="button">گزارش مشکل</button>
<div id="report-ok" class="empty-state" hidden>گزارش دریافت شد</div>
</article>
</div>
<script src="./md-render.js"></script>
<script src="./game.js"></script>
</body>
</html>
