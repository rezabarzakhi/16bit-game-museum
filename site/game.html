<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>صفحه بازی | سوپر شانزده بیت</title>
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../design/components.css">
<style>
body { background: radial-gradient(circle at 50% 0%, #1B2450 0%, var(--bg) 60%); color: var(--text); font-family: var(--font-fa); margin: 0; padding: 1.5rem 1rem 3rem; }
.wrap { max-width: 1020px; margin-inline: auto; display: grid; gap: 1.25rem; }
a { color: var(--accent); }
.detail-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.25rem; }
@media (max-width: 860px) { .detail-grid { grid-template-columns: 1fr; } }
.cart-panel { background: linear-gradient(180deg, #E4E4E9, var(--snes-body-shadow)); color: var(--snes-dark); border: 4px solid #101018; border-radius: 12px; box-shadow: 0 6px 0 #101018; overflow: hidden; }
.cart-panel__grip { height: 14px; background: repeating-linear-gradient(90deg, var(--snes-groove) 0 10px, #8E8EA0 10px 14px); border-bottom: 3px solid #101018; }
.cart-panel__body { padding: 1rem 1.1rem; display: grid; gap: 0.7rem; }
.cart-panel__body h1 { margin: 0; line-height: 1.7; font-size: 1.4rem; }
.cart-panel__body p { margin: 0; line-height: 2; color: #33333F; }
#cover img { width: 100%; height: 220px; object-fit: cover; image-rendering: pixelated; display: block; border-bottom: 3px solid #101018; }
.meta { color: var(--muted); font-size: 0.85rem; line-height: 2; }
.manual { background: var(--paper); color: #23232E; border: 4px solid #101018; border-radius: 12px; box-shadow: 0 6px 0 #101018; padding: 1.2rem 1.3rem; }
.manual .article-body { color: #23232E; }
.manual .article-body a { color: #463A6B; }
</style>
</head>
<body>
<div class="wrap">

<div class="console-shell">
<div class="console-shell__brand">
<span class="power-led" aria-hidden="true"></span>
<div class="console-shell__title">
سوپر شانزده بیت
<small>کارتریج در حال اجرا</small>
</div>
</div>
<div class="console-shell__actions">
<a href="./index.html">بازگشت به قفسه</a>
</div>
</div>
<div class="purple-stripe" aria-hidden="true"></div>

<div id="empty" class="empty-state" hidden>چیزی پیدا نشد</div>

<article id="game" hidden>
<div class="detail-grid">
<section class="crt" aria-label="تلویزیون">
<div class="emu-container" id="frame"><button class="game-frame__start" id="start" type="button">شروع</button></div>
<div class="crt__bar">
<span class="channel-badge" dir="ltr">CH-16</span>
<span class="press-start">دکمه شروع را بزن</span>
<span class="console-badge" id="console"></span>
</div>
<p class="mobile-warning">تجربه بهتر با رایانه</p>
</section>

<aside class="cart-panel">
<div class="cart-panel__grip"></div>
<div id="cover"></div>
<div class="cart-panel__body">
<h1 id="title"></h1>
<p id="summary"></p>
<h2 style="margin:0;">راهنمای دسته</h2>
<div class="control-guide" id="controls"></div>
</div>
</aside>
</div>

<section class="manual">
<h2 style="margin-top:0;">دفترچه راهنما</h2>
<div class="article-body" id="article"><p>در حال بارگذاری مقاله</p></div>
<div class="license-box" id="license"></div>
<p class="meta" id="meta"></p>
<div id="tags" style="display:flex;gap:0.5rem;flex-wrap:wrap;"></div>
<br>
<button class="report-button" id="report" type="button" style="color:#463A6B;border-color:#463A6B;">گزارش مشکل</button>
<div id="report-ok" class="empty-state" hidden>گزارش دریافت شد</div>
</section>
</article>

</div>
<script src="./md-render.js?v=2"></script>
<script src="./game.js?v=2"></script>
</body>
</html>
